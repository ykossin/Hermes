locale = ru
av1_mode = 0
origin_web_ui_allowed = wan
csrf_allowed_origins = https://localhost:47990,https://127.0.0.1:47990,https://[::1]:47990

virtual_display_backend = hermes_kms
hermes_kms_multi_output = true
isolated_virtual_display_option = false  # use hermes_kms_isolated_sessions for session pool

capture = kms
min_log_level = info
sunshine_name = hermes-host
ignore_encoder_probe_failure = true

# Connector layout (configurable; was hardcoded in virtual_display.cpp)
hermes_kms_left_connectors = [Virtual-1, HERMES-1]
hermes_kms_right_connectors = [Virtual-2, HERMES-2]
virtual_connector_prefixes = [Virtual-, HERMES-]
hermes_kms_default_virtual_width = 1920

# Physical desktop tile (configurable; was hardcoded in process.cpp)
physical_capture_probe_connector = DP-1
physical_capture_fallback_connector = Virtual-1
